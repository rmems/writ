# Codacy configuration for the Rust-only workspace, restored after #144.
#
# The org quality gate uses issueThreshold=0, so a single unsuppressed
# false-positive class blocks every PR. Two such classes exist here:
#
# 1. Agentlinter flags "absolute rule without escape hatch" on AGENTS.md and
#    CLAUDE.md. That is precisely what those files are for: `never merge
#    autonomously` and `bare --force is forbidden` are deny-by-default safety
#    rules, and adding an escape hatch to satisfy a linter would weaken the
#    security contract. Excluded here rather than softening the text.
#    (PR #144 reproduced exactly this: 2 medium BestPractice findings on
#    AGENTS.md L106 and L165.)
#
# 2. Cyclomatic-complexity engines flag the coordination surfaces, which keep
#    explicit parameters and branched schema negotiation on purpose. Do not
#    rewrite them for complexity theater. Security engines stay enabled.
#
# `metric` is Codacy's official cyclomatic-complexity engine name; `complexity`
# and `lizard` are included so either Cloud spelling still applies.
#
# Paths use globs so the `wh` -> `writ` crate rename did not
# invalidate this file.
---
exclude_paths:
  # Rust integration tests. These MUST be excluded at the top level, not only
  # under the per-engine blocks below: the security engine is not scoped by
  # those, so `temp_dir should not be used for security operations` fires on
  # `crates/*/tests/*.rs` test fixtures. The previous config had `**/tests/**`
  # here for the same reason; dropping it re-opened the hole.
  - "crates/*/tests/**"
  - "AGENTS.md"
  - "CLAUDE.md"
  - "**/target/**"

engines:
  duplication:
    exclude_paths:
      - "crates/*/tests/**"
      - "crates/*/src/pr_import.rs"
      - "**/target/**"
# `supervisor.rs` complexity is excluded: hang-recovery wait/select loops and
# the extracted `supervisor_cmd.rs` policy surface keep explicit branches by
# design (same reason `git_safe/**` is excluded). Security engines stay enabled.
  #
  # `pr_import.rs` is the exact-object fork-head boundary: explicit PR identity,
  # allowlisted fetch argv, and fail-closed residual reporting. Unit tests live in
  # the same module (they need `pub(crate)` helpers), so complexity engines count
  # fixtures as production code. Exclude complexity here the same way as
  # `worktree.rs`; security engines stay enabled.
  #
  # `git_safe/**` is the git/gh argv classifier surface (formerly a single
  # `git_safe.rs`). Complexity engines stay scoped here; security engines stay
  # enabled on these paths.
  #
  # `paths.rs` is included because Codacy's complexity engine does not parse
  # `#[cfg]` and reported `strip_verbatim_prefix` as 231 LOC (the rest of the
  # file) on the rename PR. The Windows body is split out so a working parser
  # stays under the limit; the exclusion keeps the same parser artifact from
  # blocking a rename-as-new-file scan. Security engines stay enabled on this
  # file.
  #
  # `checkout.rs` is the harness-owned checkout registration surface
  # (inspect + register/unregister). Its unit tests live in-module because they
  # need `pub(crate)` helpers, so file-NLOC counts fixtures as production code —
  # the same reason `pr_import.rs` is excluded. Security engines stay enabled.
  #
  # `attribution.rs` keeps in-module tests next to private env-key and sanitizer
  # helpers. Codacy's file-NLOC metric counted those fixtures as production
  # code (578 NLOC) and blocked this PR. Same reason as `checkout.rs`.
  # Security engines stay enabled.
  #
  # `status.rs` is the lease-store snapshot surface. Unit tests live in-module
  # so they can grant/release against a temp store; complexity engines count
  # those fixtures as production NLOC. Security engines stay enabled.
  # `watchlist.rs` / `watchlist/**` is a read-only collaboration view over
  # leases.db. Unit tests live beside the loaders (sqlite row maps, probe
  # JSON). Complexity engines count those fixtures and query_map closures as
  # production cyclomatic complexity. Security engines stay enabled.
  #
  # `coord.rs` was modularized into `coord/mod.rs` plus siblings
  # (`declared_paths.rs`, etc.). Complexity/metric/lizard exclude the
  # directory glob so branched schema negotiation stays excluded on purpose,
  # the same way as `lease/**` / `git_safe/**` / `watchlist/**`. Security
  # engines stay enabled on these paths.
  complexity:
    exclude_paths:
      - "crates/*/tests/**"
      - "crates/*/src/attribution.rs"
      - "crates/*/src/checkout.rs"
      - "crates/*/src/coord/**"
      - "crates/*/src/lease/**"
      - "crates/*/src/status.rs"
      - "crates/*/src/worktree.rs"
      - "crates/*/src/error.rs"
      - "crates/*/src/git_safe/**"
      - "crates/*/src/main.rs"
      - "crates/*/src/paths.rs"
      - "crates/*/src/pr_import.rs"
      # Hang-recovery / timeout policy: branched containment by design.
      # Security engines stay enabled.
      - "crates/*/src/supervisor.rs"
      - "crates/*/src/supervisor_cmd.rs"
      - "crates/*/src/supervisor_tests.rs"
      - "crates/*/src/supervisor_policy_tests.rs"
      - "crates/*/src/timeout_policy.rs"
      - "crates/*/src/watchlist.rs"
      - "crates/*/src/watchlist/**"
  metric:
    exclude_paths:
      - "crates/*/tests/**"
      - "crates/*/src/attribution.rs"
      - "crates/*/src/checkout.rs"
      - "crates/*/src/coord/**"
      - "crates/*/src/lease/**"
      - "crates/*/src/status.rs"
      - "crates/*/src/worktree.rs"
      - "crates/*/src/error.rs"
      - "crates/*/src/git_safe/**"
      - "crates/*/src/main.rs"
      - "crates/*/src/paths.rs"
      - "crates/*/src/pr_import.rs"
      - "crates/*/src/supervisor.rs"
      - "crates/*/src/supervisor_cmd.rs"
      - "crates/*/src/supervisor_tests.rs"
      - "crates/*/src/supervisor_policy_tests.rs"
      - "crates/*/src/timeout_policy.rs"
      - "crates/*/src/watchlist.rs"
      - "crates/*/src/watchlist/**"
  lizard:
    exclude_paths:
      - "crates/*/tests/**"
      - "crates/*/src/attribution.rs"
      - "crates/*/src/checkout.rs"
      - "crates/*/src/coord/**"
      - "crates/*/src/lease/**"
      - "crates/*/src/status.rs"
      - "crates/*/src/worktree.rs"
      - "crates/*/src/error.rs"
      - "crates/*/src/git_safe/**"
      - "crates/*/src/main.rs"
      - "crates/*/src/paths.rs"
      - "crates/*/src/pr_import.rs"
      - "crates/*/src/supervisor.rs"
      - "crates/*/src/supervisor_cmd.rs"
      - "crates/*/src/supervisor_tests.rs"
      - "crates/*/src/supervisor_policy_tests.rs"
      - "crates/*/src/timeout_policy.rs"
      - "crates/*/src/watchlist.rs"
      - "crates/*/src/watchlist/**"
