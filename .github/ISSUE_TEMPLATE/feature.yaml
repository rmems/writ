name: Feature
description: New skill, CLI, or enforcement capability
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this template for a new `writ` capability. Keep the write-up short
        enough that a worker can act without a second round trip. Use only the
        canonical labels in CONTRIBUTING.md. Runtime merge, auto-merge, merge
        queues, and bare `--force` are forbidden.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences. This is what workers treat as the title-level intent.
      placeholder: Reject ambiguous unqualified start-point refs during worktree create.
    validations:
      required: true

  - type: textarea
    id: problem-context
    attributes:
      label: Problem / context
      description: What is blocked today, who hits it, and why a new capability is the right fix.
      placeholder: Exact-base resolution accepts an ambiguous refname, so a worker can start from a same-named tag.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkboxes workers parse as the Done bar. Add or delete rows as needed.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: dropdown
    id: canonical-label
    attributes:
      label: Canonical label
      description: Apply this same GitHub label on the issue. Do not invent a new name.
      options:
        - core
        - orchestrator
        - platform
        - safety
        - docs
        - epic
    validations:
      required: true

  - type: textarea
    id: linear
    attributes:
      label: Linear
      description: Planning twin. Keep this footer even when no twin exists yet; replace the placeholders when it does.
      value: |
        Linear: <url> (`RM-N`)
    validations:
      required: true
