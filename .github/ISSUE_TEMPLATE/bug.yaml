name: Bug
description: Unexpected skill, CLI, CI, or process failure
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Report a failure in worktree isolation, safety gates, CI, or agent
        process. Include commands and exit codes when a CLI path is involved.
        Use only the canonical labels in CONTRIBUTING.md. Runtime merge,
        auto-merge, merge queues, and bare `--force` are forbidden.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences. This is what workers treat as the title-level intent.
      placeholder: "`writ worktree create` accepts an ambiguous start-point ref and checks out the tag."
    validations:
      required: true

  - type: textarea
    id: problem-context
    attributes:
      label: Problem / context
      description: "Repro steps, expected vs actual, and commands with exit codes. Attach `--json` envelopes when relevant."
      placeholder: |
        1. Command run
        2. Observed result (stdout/stderr, exit code)
        3. Expected result
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkboxes workers parse as the Done bar. Add or delete rows as needed.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: dropdown
    id: canonical-label
    attributes:
      label: Canonical label
      description: Apply this same GitHub label on the issue. Do not invent a new name.
      options:
        - core
        - orchestrator
        - platform
        - safety
        - docs
        - epic
    validations:
      required: true

  - type: textarea
    id: linear
    attributes:
      label: Linear
      description: Planning twin. Keep this footer even when no twin exists yet; replace the placeholders when it does.
      value: |
        Linear: <url> (`RM-N`)
    validations:
      required: true
