# Security gates for the Rust workspace: dependency advisories and CodeQL.
#
# Coverage deliberately does NOT live here. This file used to carry a
# `coverage` job that built cargo-tarpaulin from source and uploaded a
# cobertura.xml artifact that nothing ever downloaded -- a second coverage
# tool measuring the same workspace as `test (ubuntu-latest)` in rust.yml,
# which already produces lcov and reports it to Codecov. It was the slowest
# job in CI (~3m30s, most of it compiling the tool) for no consumed output.
# Coverage has one owner: `cargo llvm-cov` in rust.yml.

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * 1" # weekly on Monday at 08:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      # Bare `cargo install cargo-audit` compiles from crates.io and currently
      # fails while building tinyvec 1.13.0 (`vec` macro shadowed by
      # `use alloc::vec::{self, Vec}`). Install the official prebuilt
      # cargo-audit release instead; do not fall back to compiling from source.
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@4076c08d76dba979c11a7285295b0716c1d67908 # v2.87.15
        with:
          tool: cargo-audit
          fallback: none

      - name: Run security audit
        run: cargo audit

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: rust

      - name: Autobuild
        uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
