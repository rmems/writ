# Qodana static analysis for the Rust workspace.
#
# Restored after #144 removed the Python-only configuration. The linter changed
# from `qodana-python-community` to `qodana-rust`, and that change carries a
# licensing consequence that dictates this workflow's triggers:
#
#   `qodana-rust` is EAP and is available only under Ultimate / Ultimate Plus.
#   There is no community Rust linter. The old workflow could run token-free
#   because a *community* linter needs no license; this one cannot.
#
# Therefore this workflow deliberately does NOT run on pull_request:
#   - Fork PRs never receive repository secrets, so a PR run would have no
#     token and would fail on licensing rather than report findings.
#   - A permanently red, non-actionable PR check trains reviewers to ignore
#     checks, which is worse than having no check.
#
# Enable the PR path only after confirming the Qodana Cloud project is licensed
# for Ultimate; then add `pull_request` back and set `pr-mode: true`.
#
# Hardening retained from the previous configuration:
# - SHA-pinned actions with version comments
# - default contents: read; write granted only for Qodana check reporting
# - concurrency cancel-in-progress
# - persist-credentials: false on checkout
name: Qodana

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "releases/*"
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "qodana.yaml"
      - ".github/workflows/qodana_code_quality.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Qodana scan
        uses: JetBrains/qodana-action@10be11607eb323a180e2b76b26c9c5cdceac3e77 # v2026.2.1
        with:
          # pr-mode is meaningless outside a pull_request event; see header.
          pr-mode: false
          # Space-separated args (the comma-separated form is deprecated).
          # The linter is named here so the workflow, not a file a contributor
          # could edit, controls what runs -- but it must be the SAME pinned
          # image as `qodana.yaml`. `--linter` overrides the file, so passing a
          # bare `qodana-rust` here would silently defeat the pin and resolve an
          # untagged EAP linter.
          #
          # No `--within-docker=false`. That flag was a Python-era carryover: it
          # paired with a host interpreter from setup-python, which this PR
          # deletes. Running `qodana-rust` outside Docker would analyse the
          # runner's ambient toolchain instead of the pinned image -- defeating
          # the pin the line above exists to protect.
          args: --linter jetbrains/qodana-rust:2026.1-eap
          # Upload only from the trusted push path, for the same reason the
          # token is scoped below.
          upload-result: ${{ github.event_name == 'push' }}
        env:
          # Scoped to push on main/releases only. `workflow_dispatch` can target
          # ANY branch, so giving it the token would let an unreviewed branch
          # consume an Ultimate-licensed scan and publish results into the Qodana
          # Cloud project, polluting run history and baselines. The previous
          # configuration documented this restriction explicitly; an earlier
          # revision of this file dropped it by applying the secret
          # unconditionally.
          QODANA_TOKEN: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/releases/'))) && secrets.QODANA_TOKEN || '' }}
