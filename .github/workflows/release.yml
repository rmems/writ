# Binary releases for the Rust workspace.
#
# What this replaces: every job in the previous version of this file was gated,
# directly or transitively, on a `check-python-pkg` step testing for
# `python/Cargo.toml`. That check has reported `exists=false` for the whole life
# of the workflow, so `build-wheels`, `build-sdist`, `publish-pypi` and
# `github-release` were all skipped on every run -- while the workflow itself
# reported success. Both tags cut so far shipped nothing:
#
#   $ gh release view v0.1.0 --json assets  ->  {"assets":[]}
#   $ gh release view v0.2.0 --json assets  ->  {"assets":[]}
#
# There is no Python package to publish any more, so the PyPI path and its
# `id-token: write` permission are gone rather than repaired.
#
# Two triggers, deliberately different:
#   - push of a `v*` tag  -> build every target AND publish a GitHub release
#   - workflow_dispatch   -> build every target and stop
#
# The dispatch path exists so this workflow can be exercised without cutting a
# release. That matters: a release workflow that is only ever run by tagging is
# a workflow whose first real test is a release you cannot take back.
#
# Targets are built on native runners rather than cross-compiled, so no `cross`
# or linker configuration is involved. ARM Linux and both macOS architectures
# have first-party runners, and this repository is public, so they are free.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Intel macOS. `macos-13` was the usual label for this and is now
          # retired; `macos-15-intel` is the current x86_64 image.
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Same pin as rust.yml. A release binary is built with the toolchain the
      # workspace declares, not with whatever `stable` happens to be that day.
      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: "1.97.1"

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-${{ matrix.target }}

      # --locked: a release must build from the committed Cargo.lock, never from
      # a lockfile silently updated on the runner.
      - name: Build
        run: cargo build --release --locked

      # The binary name is read from cargo metadata rather than hardcoded, so
      # this workflow survives the `wh` -> `writ` crate rename (#145) without an
      # edit. Archives are uniformly .tar.gz, including Windows: tar ships with
      # Windows 10 and later, and one format keeps the checksum step trivial.
      #
      # `jq` needs no install step. It is preinstalled on all three GitHub
      # runner images, Windows included, and this step is `shell: bash` so the
      # same script runs everywhere. Verified rather than assumed: dispatching
      # this workflow on the branch built x86_64-pc-windows-msvc successfully
      # and produced a 679,896-byte artifact.
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bin=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '[.packages[].targets[] | select(.kind[] == "bin") | .name] | first')
          if [ -z "$bin" ] || [ "$bin" = "null" ]; then
            echo "::error::no binary target found in cargo metadata"
            exit 1
          fi
          echo "Binary: $bin"

          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            ext=".exe"
          fi

          # `set -e` would already abort on a missing file, but with `cp: cannot
          # stat ...` buried in the log rather than surfaced on the run. Name the
          # two files a rename could plausibly break, so the failure explains
          # itself.
          for required in README.md LICENSE; do
            if [ ! -f "$required" ]; then
              echo "::error::${required} not found at the repository root; the release archive expects it"
              exit 1
            fi
          done

          staging="${bin}-${TARGET}"
          mkdir -p "dist/${staging}"
          cp "target/release/${bin}${ext}" "dist/${staging}/"
          cp README.md LICENSE "dist/${staging}/"
          tar --create --gzip --file "dist/${staging}.tar.gz" -C dist "${staging}"
          echo "Packaged dist/${staging}.tar.gz"

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: [build]
    # Tags publish; workflow_dispatch stops after `build`, leaving the archives
    # downloadable from the run for inspection.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
          path: dist/

      # Generated here, on one runner, rather than per-target: macOS has
      # `shasum` and Linux has `sha256sum`, and doing it once avoids that split
      # while producing a single file a user can verify the whole release with.
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          ls -1 ./*.tar.gz
          sha256sum ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
