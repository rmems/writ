# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Draft CodeRabbit config for rmems/writ (generated locally, not pushed).
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  fail_commit_status: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
  - '!**/target/**'
  path_instructions:
  - path: crates/**/*.rs
    instructions: 'Rust edition 2024; `rust-version = "1.97.1"`; `rust-toolchain.toml` pins 1.97.1. Do not suggest downgrading the edition or using std/language APIs newer than the pinned toolchain/MSRV. CI gate: `cargo clippy --workspace --all-targets -- -D warnings`, `cargo test --workspace`, `cargo build --release --locked`, `cargo audit`. Flag anything that would fail `cargo fmt --check` or clippy `-D warnings`. Workspace lints set `unsafe_code = "deny"`; the only allowed exception is in `crates/writ-core/src/supervisor.rs`. Flag any new `#[allow(unsafe_code)]` - unsafe needs a separately reviewed design (REVIEW.md). Lease-store writes go through SQLite; don''t add a writer for legacy `watched.json`.'
  - path: '**/Cargo.toml'
    instructions: Cargo manifest. Call out new dependencies and feature changes, and keep `rust-version` / `edition` consistent with CI.
  - path: .github/workflows/**
    instructions: GitHub Actions workflows. Keep `permissions:` least-privilege and job commands in sync with the local gates documented in the repo. Every `uses:` is pinned to a full commit SHA today; new or bumped actions must be too. actionlint 1.7.12 runs in CI (`actionlint.yml`).
  tools:
    clippy:
      enabled: true
    shellcheck:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    biome:
      enabled: false
